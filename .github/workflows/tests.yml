name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Production runs on Supabase Postgres; tests/test_postgres.py exercises the same code here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cordia
          POSTGRES_PASSWORD: cordia
          POSTGRES_DB: cordia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cordia" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py cordia tests

      - name: Run tests
        env:
          CORDIA_TEST_DATABASE_URL: postgresql://cordia:cordia@localhost:5432/cordia
        run: python -m unittest discover -s tests -v
